            </li>
            <li class="nav-item menu-item text-white p-2">
              <a href="my-leaves.html" class="text-white text-decoration-none"><i class="fas fa-user-clock"></i> My

            <li class="nav-item menu-item text-white p-2">

      <!-- Main Content -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mt-3">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Leave</li>
            <li class="breadcrumb-item active" aria-current="page">Leave application</li>
          </ol>
        </nav>



        <!-- Leave Application Form -->
        <div class="card mb-5">
          <div class="card-header bg-primary text-white">
            Leave Application Form
          </div>
          <div class="card-body">
            <form>
              <div class="mb-3">
                <label class="form-label">Is this a:</label><br />
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="day_type" value="half" />
                  <label class="form-check-label">Half Day</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="day_type" value="full" />
                  <label class="form-check-label">Full Day</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="day_type" value="second_half" />
                  <label class="form-check-label">Second Half</label>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Leave Type</label>
                <select class="form-select">
                  <option>Casual</option>
                  <option>Annual</option>
                  <option>Off Days</option>
                  <option>Medical</option>
                  <option>Matrimonial</option>
                  <option>Field Visit / Official Duty</option>
                  <option>Umrah</option>
                  <option>Hajj</option>
                  <option>Paternal</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Application Date</label>
                <input type="date" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label">Number of Days</label>
                <input type="number" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label">Start Time</label>
                <input type="time" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label">End Time</label>
                <input type="time" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label">Leave Required From</label>
                <input type="date" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label">To</label>
                <input type="date" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label">Reason</label>
                <textarea class="form-control" rows="3"></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label">Upload Application</label>
                <input type="file" class="form-control" />
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Apply for Leave</button>
                <button type="reset" class="btn btn-danger">Cancel</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Footer -->
        <footer class="footer text-center mt-auto py-3">
          <p>© 2018 READ FOUNDATION. ALL RIGHTS RESERVED</p>
        </footer>
