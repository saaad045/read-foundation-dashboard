<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Read Foundation | Login</title>
  <meta name="description" content="Login page for visually impaired users with a modern and accessible design."/>
  
  <!-- CSS Links -->
  <link rel="stylesheet" href="./css/login.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- Login Form -->
    <main class="login-container">
      <section class="login-box" aria-labelledby="login-heading">
        <h1 id="login-heading">Welcome Back</h1>
        <form action="login.php" method="POST">
          <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" aria-required="true" required />
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" aria-required="true" required />
          </div>
          <button type="submit" class="login-btn" aria-label="Login to your account">Login</button>
          <div class="forgot-password">
            <a href="forgot-pw.html" aria-label="Reset your password">Forgot your password?</a>
          </div>
        </form>
        <div class="signup-link">
          <p>Don't have an account? <a href="signup.html" aria-label="Go to sign up page">Sign Up</a></p>
        </div>
      </section>
    </main>
  <!-- Scripts -->
  <script src="./js/script.js"></script>
  <script>
    function toggleMenu() {
      const nav = document.querySelector('.nav-links');
      nav.classList.toggle('active');
    }

    // Read Aloud Feature
    let isSpeaking = false;
    let utterance = null;

    document.getElementById("speaker-icon").addEventListener("click", function () {
      const bodyText = document.body.innerText;

      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        this.innerHTML = '🔊';
      } else {
        utterance = new SpeechSynthesisUtterance(bodyText);
        utterance.voice = speechSynthesis.getVoices().find(voice => voice.name.includes("Google") || voice.default);
        utterance.rate = 1;
        utterance.pitch = 1;
        window.speechSynthesis.speak(utterance);
        isSpeaking = true;
        this.innerHTML = '❌';

        utterance.onend = () => {
          isSpeaking = false;
          document.getElementById("speaker-icon").innerHTML = '🔊';
        };
      }
    });
  </script>
</body>
</html>
